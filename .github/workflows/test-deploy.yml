name: Test deployment

on:
  pull_request:
    branches:
      - main
    # 与 deploy.yml 同一套过滤：纯工程文件不改变站点产物，不必跑构建检查。
    # 注意 GitHub 的 glob 语义：'*' 不跨斜杠，跨目录必须用 '**'。
    # 只要 PR 里有一个文件不在下面清单内（如 blog/ docs/ src/ static/ config），检查照常跑。
    paths-ignore:
      - 'CLAUDE.md'
      - 'GLOSSARY.md'
      - 'README.md'
      - 'openspec/**'
      - 'scripts/**'
      - '.claude/**'
      - '.worktreeinclude'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.idea/**'
      - '.vscode/**'

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test build website
        run: pnpm build
