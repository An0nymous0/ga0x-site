name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # 只跳过纯工程文件：这些文件不参与站点构建，改动它们不需要重新发布。
    # 注意 GitHub 的 glob 语义：'*' 不跨斜杠，跨目录必须用 '**'。
    # 判断依据是「是否产出 build/ 变化」：
    #   CLAUDE.md / GLOSSARY.md / README.md  —— agent 与开发者文档，不进站点
    #   openspec/                            —— 规格驱动开发的制品
    #   scripts/                             —— 本地工具（ghpages_sim.py 等）
    #   .claude/                             —— Claude Code 的 skills 与 commands
    #   .worktreeinclude                     —— Orca worktree 继承清单
    #   .gitignore / .gitattributes / .editorconfig —— 版本控制与编辑约定
    #   .idea/ .vscode/                      —— IDE 配置
    # 一旦某次 push 同时改了上面这些和 blog/docs/src/static 等，workflow 照常触发
    # （paths-ignore 只在「全部改动文件都命中」时才跳过）。
    paths-ignore:
      - 'CLAUDE.md'
      - 'GLOSSARY.md'
      - 'README.md'
      - 'openspec/**'
      - 'scripts/**'
      - '.claude/**'
      - '.worktreeinclude'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.idea/**'
      - '.vscode/**'
  # 允许手动重新发布（内容没变也能强制跑一次，用于排障或重置 gh-pages）
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        #fix https://github.com/facebook/docusaurus/issues/2798#issuecomment-636602951
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build website
        run: pnpm build

      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output to publish to the `gh-pages` branch:
          publish_dir: ./build
          # The following lines assign commit authorship to the official
          # GH-Actions bot for deploys to `gh-pages` branch:
          # https://github.com/actions/checkout/issues/13#issuecomment-724415212
          # The GH actions bot is used by default if you didn't specify the two fields.
          # You can swap them out with your own user credentials.
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
